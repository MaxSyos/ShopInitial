global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR_WEBHOOK_URL'
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@shopinitial.com'
  smtp_auth_username: 'YOUR_EMAIL'
  smtp_auth_password: 'YOUR_PASSWORD'

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 10s
    repeat_interval: 1h

  - match:
      service: database
    receiver: 'database-team'
    group_by: ['alertname', 'instance']
    
  - match:
      service: payments
    receiver: 'payment-team'
    group_by: ['alertname']

receivers:
- name: 'default-receiver'
  slack_configs:
  - channel: '#monitoring'
    send_resolved: true
    icon_emoji: ':information_source:'
    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
    text: >-
      {{ range .Alerts }}
        *Alert:* {{ .Annotations.summary }}
        *Description:* {{ .Annotations.description }}
        *Severity:* {{ .Labels.severity }}
      {{ end }}

- name: 'critical-alerts'
  slack_configs:
  - channel: '#critical-alerts'
    send_resolved: true
    icon_emoji: ':red_circle:'
    title: '[CRÍTICO] {{ .CommonLabels.alertname }}'
  email_configs:
  - to: 'team-leads@shopinitial.com'
    send_resolved: true
    html: '{{ template "email.default.html" . }}'

- name: 'database-team'
  slack_configs:
  - channel: '#db-alerts'
    send_resolved: true
    icon_emoji: ':database:'
  email_configs:
  - to: 'dba@shopinitial.com'

- name: 'payment-team'
  slack_configs:
  - channel: '#payment-alerts'
    send_resolved: true
    icon_emoji: ':money_with_wings:'
  email_configs:
  - to: 'payments@shopinitial.com'
    title: |-
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
    text: >-
      {{ range .Alerts }}
        *Alert:* {{ .Annotations.summary }}
        *Description:* {{ .Annotations.description }}
        *Severity:* {{ .Labels.severity }}
        *Started:* {{ .StartsAt | time }}
      {{ end }}
